[project]
name = "lang-tools-lab"
version = "0.1.0"
description = "LangSmith, Langfuse, LLaMA-Factory hands-on lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langsmith==0.14.12",
  "langfuse==5.0.4",
  "langchain-core==1.7.0",
  "openai==3.37.0",
  "python-dotenv==1.2.4",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
